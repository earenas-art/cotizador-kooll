<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Cotizaciones - KOOLL Aire Acondicionado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        /* Colores corporativos basados en el PDF */
        .brand-blue { color: #0284c7; }
        .bg-brand-blue { background-color: #0284c7; }
        .brand-dark { color: #1e293b; }
        .bg-brand-dark { background-color: #1e293b; }
        .border-brand { border-color: #0284c7; }

        /* Estilos específicos para la hoja A4 de vista previa */
        .paper-page {
            width: 210mm;
            min-height: 297mm;
            padding: 18mm 18mm 18mm 18mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Estilos de Impresión */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .paper-page {
                box-shadow: none !important;
                padding: 12mm !important;
                width: 100% !important;
                min-height: auto !important;
                margin: 0 !important;
                page-break-after: avoid;
                page-break-inside: avoid;
            }
            .page-break {
                page-break-before: always;
            }
            @page {
                size: letter portrait;
                margin: 0;
            }
        }

        /* Estilos de tabla estilizada */
        .quote-table th {
            background-color: #f8fafc;
            color: #334155;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            border-bottom: 2px solid #e2e8f0;
            padding: 10px 12px;
        }
        .quote-table td {
            border-bottom: 1px solid #f1f5f9;
            padding: 10px 12px;
            font-size: 0.875rem;
        }

        /* Esquina superior con corte de diseño */
        .corner-accent {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 80px 80px 0;
            border-color: transparent #93c5fd transparent transparent;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header principal de la aplicación -->
    <header class="bg-slate-900 text-white py-4 px-6 shadow-md no-print mb-8 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-sky-500 p-2 rounded-lg text-white">
                    <i class="fa-solid font-bold fa-snowflake text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">KOOLL AIRE - GENERADOR DE COTIZACIONES</h1>
                    <p class="text-xs text-slate-400">Plataforma de Edición e Impresión Profesional</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="resetData()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> Restablecer Ejemplo
                </button>
                <button onclick="window.print()" class="px-5 py-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-sm font-semibold shadow-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> Imprimir / Guardar PDF
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-[1600px] mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- PANEL DE EDICIÓN -->
        <div class="lg:col-span-5 space-y-6 no-print">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2 border-b pb-3">
                    <i class="fa-solid fa-sliders text-sky-600"></i> Datos de la Cotización
                </h2>

                <div class="space-y-4">
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-
